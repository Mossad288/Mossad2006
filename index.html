<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الفواتير - الإسكافي ALESKAFY SHOES</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #f59e0b;
            --btn-green: #22c55e;
            --btn-blue: #3b82f6;
            --btn-yellow: #eab308;
            --btn-sky: #06b6d4;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
        }

        .field-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        input[type="text"], input[type="tel"] {
            text-align: right;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-green { background-color: var(--btn-green); }
        .btn-blue { background-color: var(--btn-blue); }
        .btn-yellow { background-color: var(--btn-yellow); color: #000; }
        .btn-sky { background-color: var(--btn-sky); }

        .notice-box {
            background-color: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            font-weight: bold;
        }

        .remaining-field {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <form id="invoiceForm">
        <!-- اسم العميل -->
        <div class="field-group">
            <label>👤 اسم العميل:</label>
            <input type="text" id="customer_name" placeholder="اسم العميل" required>
        </div>

        <!-- واتساب العميل -->
        <div class="field-group">
            <label>📱 واتساب العميل:</label>
            <input type="tel" id="phone" placeholder="01012345678" required>
        </div>

        <!-- تاريخ الاستلام وتاريخ التسليم -->
        <div class="row-2 field-group">
            <div>
                <label>📅 تاريخ الاستلام:</label>
                <input type="date" id="receive_date">
            </div>
            <div>
                <label>📦 تاريخ التسليم:</label>
                <input type="date" id="deliver_date">
            </div>
        </div>

        <!-- خانات الأعداد (السطر الأول) -->
        <div class="row-3 field-group">
            <div>
                <label>👟 كوتشيات:</label>
                <input type="number" id="count_sneakers" value="0" min="0" oninput="calculateCounts()">
            </div>
            <div>
                <label>🥾 جزم:</label>
                <input type="number" id="count_shoes" value="0" min="0" oninput="calculateCounts()">
            </div>
            <div>
                <label>🩴 شبشب:</label>
                <input type="number" id="count_slippers" value="0" min="0" oninput="calculateCounts()">
            </div>
        </div>

        <!-- خانات الأعداد (السطر الثاني) -->
        <div class="row-3 field-group">
            <div>
                <label>👡 صندل:</label>
                <input type="number" id="count_sandals" value="0" min="0" oninput="calculateCounts()">
            </div>
            <div>
                <label>👞 فردة:</label>
                <input type="number" id="count_single" value="0" min="0" oninput="calculateCounts()">
            </div>
            <div>
                <label>💼 شنط:</label>
                <input type="number" id="count_bags" value="0" min="0" oninput="calculateCounts()">
            </div>
        </div>

        <!-- الخدمة المطلوبة -->
        <div class="field-group">
            <label>🛠️ الخدمة المطلوبة:</label>
            <input type="text" id="details" placeholder="غسيل، خياطة..." required>
        </div>

        <!-- الحساب والمدفوع -->
        <div class="row-2 field-group">
            <div>
                <label>💰 الحساب الكلي:</label>
                <input type="number" id="price" placeholder="0" oninput="calculateTotals()" required>
            </div>
            <div>
                <label>💵 المدفوع مقدماً:</label>
                <input type="number" id="paid" placeholder="0" value="0" oninput="calculateTotals()">
            </div>
        </div>

        <!-- المبلغ المتبقي -->
        <div class="field-group">
            <label>🔴 المبلغ المتبقي:</label>
            <input type="number" id="remaining" class="remaining-field" value="0" readonly>
        </div>

        <!-- الأزرار -->
        <button type="submit" class="btn btn-green">📲 1. إرسال للعميل (وحفظ الفاتورة)</button>
        <button type="button" class="btn btn-blue" onclick="sendToShop()">📑 2. إرسال للمحل</button>
        <button type="button" class="btn btn-yellow" onclick="downloadDailyReport()">📊 تحميل التقرير اليومي</button>
        <button type="button" class="btn btn-sky" onclick="openSocialMedia()">🌐 السوشيال ميديا للمحل</button>

        <!-- التنبيه -->
        <div class="notice-box">
            ⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد 15 يوم من ميعاد الإستلام .
        </div>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://ekozcfasqvuuikdjwmtj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qfv5sexqStJWEOJY0RxGkA_6iOiVVjf';
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // تعيين تاريخ اليوم كافتراضي
    document.getElementById('receive_date').valueAsDate = new Date();

    function calculateTotals() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const paid = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('remaining').value = price - paid;
    }

    function getItemsSummary() {
        let items = [];
        const sneakers = document.getElementById('count_sneakers').value;
        const shoes = document.getElementById('count_shoes').value;
        const slippers = document.getElementById('count_slippers').value;
        const sandals = document.getElementById('count_sandals').value;
        const single = document.getElementById('count_single').value;
        const bags = document.getElementById('count_bags').value;

        if (sneakers > 0) items.push(`كوتشيات: ${sneakers}`);
        if (shoes > 0) items.push(`جزم: ${shoes}`);
        if (slippers > 0) items.push(`شبشب: ${slippers}`);
        if (sandals > 0) items.push(`صندل: ${sandals}`);
        if (single > 0) items.push(`فردة: ${single}`);
        if (bags > 0) items.push(`شنط: ${bags}`);

        return items.join(' | ') || 'صيانة متنوعة';
    }

    function formatPhone(phone) {
        let cleaned = phone.replace(/\D/g, '');
        if (cleaned.startsWith('01')) cleaned = '20' + cleaned.substring(1);
        return cleaned;
    }

    // حفظ وإرسال للعميل
    document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const customerName = document.getElementById('customer_name').value;
        const phone = document.getElementById('phone').value;
        const details = document.getElementById('details').value;
        const price = parseFloat(document.getElementById('price').value) || 0;
        const paid = parseFloat(document.getElementById('paid').value) || 0;
        const remaining = price - paid;
        const itemType = getItemsSummary();

        // 1. حفظ في Supabase
        try {
            await supabaseClient.from('invoices').insert([{
                customer_name: customerName,
                phone: phone,
                item_type: itemType,
                details: details,
                price: price,
                paid: paid,
                status: 'قيد الانتظار'
            }]);
        } catch (err) {
            console.log('Error saving:', err);
        }

        // 2. إرسال واتس للعميل
        const msg = `مرحباً ${customerName} 👋\nفاتورة صيانة من *الإسكافي ALESKAFY SHOES* 👞:\n\n` +
            `📦 *المنتجات:* ${itemType}\n` +
            `🛠️ *الخدمة:* ${details}\n` +
            `💵 *الحساب الكلي:* ${price} ج.م\n` +
            `✅ *المدفوع:* ${paid} ج.م\n` +
            `🔴 *المتبقي:* ${remaining} ج.م\n\n` +
            `⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد 15 يوم من ميعاد الإستلام.`;

        window.open(`https://wa.me/${formatPhone(phone)}?text=${encodeURIComponent(msg)}`, '_blank');
    });

    // إرسال للمحل
    function sendToShop() {
        const customerName = document.getElementById('customer_name').value;
        const phone = document.getElementById('phone').value;
        const details = document.getElementById('details').value;
        const price = parseFloat(document.getElementById('price').value) || 0;
        const paid = parseFloat(document.getElementById('paid').value) || 0;
        const remaining = price - paid;
        const itemType = getItemsSummary();

        const msg = `إشعار فاتورة جديدة 📝\n\n` +
            `👤 *العميل:* ${customerName}\n` +
            `📞 *الهاتف:* ${phone}\n` +
            `📦 *الأصناف:* ${itemType}\n` +
            `🛠️ *الخدمة:* ${details}\n` +
            `💰 *الحساب:* ${price} | *المدفوع:* ${paid} | *الباقي:* ${remaining}`;

        // ضع رقم واتس المحل هنا
        window.open(`https://wa.me/201000000000?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function downloadDailyReport() {
        alert('جاري إعداد التقرير اليومي...');
    }

    function openSocialMedia() {
        window.open('https://facebook.com', '_blank');
    }
</script>

</body>
</html>
