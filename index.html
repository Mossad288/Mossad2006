<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        @keyframes goldGlow {
            0% { border-color: #bf953f; box-shadow: 0 0 15px rgba(191, 149, 63, 0.3); }
            50% { border-color: #ffc107; box-shadow: 0 0 25px rgba(255, 193, 7, 0.6); }
            100% { border-color: #bf953f; box-shadow: 0 0 15px rgba(191, 149, 63, 0.3); }
        }

        @keyframes shimmerText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            font-family: sans-serif; 
            background: #000000; 
            margin: 0; 
            padding: 15px; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background-image: radial-gradient(circle at 50% 50%, #1a1500 0%, #000000 80%);
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            background: #0c0c0c; 
            padding: 22px; 
            border-radius: 16px; 
            border: 2px solid #bf953f; 
            animation: goldGlow 4s infinite ease-in-out;
            display: block; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: max-width 0.3s ease;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 900px; 
                padding: 30px;
            }
        }

        h1 { 
            text-align: center; 
            margin: 0 0 5px 0; 
            font-size: 28px; 
            font-weight: 900;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shimmerText 5s linear infinite;
            letter-spacing: 1px;
        }

        .badge { 
            background: linear-gradient(135deg, #bf953f, #aa771c); 
            color: #000; 
            font-weight: bold; 
            padding: 10px 14px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin: 12px 0; 
            font-size: 14px; 
            width: 100%; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }
        
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-weight: bold; line-height: 1.1; }
        .fraction .numerator { border-bottom: 2px solid currentColor; padding-bottom: 1px; }
        .fraction .denominator { padding-top: 1px; }

        label { display: block; margin-top: 12px; font-size: 13px; color: #d4af37; font-weight: 600; }
        input, select { width: 100%; padding: 11px; margin-top: 5px; border: 1px solid #33270a; border-radius: 8px; background: #141414; color: #fff; box-sizing: border-box; transition: all 0.3s ease; font-size: 14px; text-align: center; }
        input:focus, select:focus { border-color: #f3e5ab; outline: none; box-shadow: 0 0 8px rgba(243, 229, 171, 0.4); }

        .row { display: flex; gap: 10px; flex-wrap: wrap; } .row div { flex: 1; min-width: 30%; }
        
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; transition: transform 0.2s, opacity 0.2s; font-size: 14px; }
        .btn:active { transform: scale(0.98); }

        .notice-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; text-align: center; font-size: 13px; color: #fca5a5; }
        
        .camera-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; }
        .track-btn { background: linear-gradient(135deg, #0891b2, #164e63); color: #fff; }
        
        #previewsContainer { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; max-height: 160px; overflow-y: auto; padding: 5px; background: #141414; border-radius: 8px; border: 1px solid #33270a; }
        .preview-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 6px; border: 2px solid #bf953f; flex-shrink: 0; }

        .manage-section { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #bf953f; }
        .result-box { margin-top: 10px; padding: 10px; background: #141414; border-radius: 8px; border: 1px solid #33270a; font-size: 13px; display: none; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .bg-pending { background: #d97706; color: white; }
        .bg-done { background: #16a34a; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .loading-text { color: #f3e5ab; font-size: 13px; text-align: center; margin-top: 8px; font-weight: bold; display: none; }
        
        .footer-credits { text-align: center; margin-top: 22px; padding-top: 14px; border-top: 1px solid #221a05; font-size: 12px; color: #94a3b8; font-weight: 500; letter-spacing: 0.5px; }
        .footer-credits span { 
            background: linear-gradient(135deg, #bf953f, #fcf6ba);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900; 
            font-size: 13px;
        }
    </style>
</head>
<body onload="initApp();">

<div class="container" id="mainApp">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <div class="badge" id="badge">رقم الأوردر: جاري التحميل...</div>
    </div>

    <form id="invoiceForm">
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل (محلي أو دولي):</label><input type="text" id="phone" placeholder="01012345678 أو كود الدولة والرقم">
        
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
            <div><label>🩴 شبشب:</label><input type="number" id="slp" value="0"></div>
        </div>
        
        <div class="row">
            <div><label>👡 صندل:</label><input type="number" id="snd" value="0"></div>
            <div><label>👞 فردة:</label><input type="number" id="sng" value="0"></div>
            <div><label>💼 شنط:</label><input type="number" id="bags" value="0"></div>
        </div>
        
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">

        <label>🗄️ مكان التخزين (الرف بالمحل):</label>
        <select id="shelfLocation">
            <option value="الرف : أ">الرف : أ</option>
            <option value="الرف : ب">الرف : ب</option>
            <option value="الرف : ج">الرف : ج</option>
            <option value="الرف : د">الرف : د</option>
            <option value="الرف : هـ">الرف : هـ</option>
            <option value="الرف : و">الرف : و</option>
        </select>
        
        <label>📷 تصوير القطع قبل الصيانة:</label>
        <input type="file" id="itemImages" accept="image/*" multiple style="display:none;" onchange="handleImagesSelection(event)">
        <button type="button" class="btn camera-btn" onclick="document.getElementById('itemImages').click();">📷 تصوير / اختيار عدة صور</button>
        
        <div id="previewsContainer"></div>
        <div id="uploadStatus" class="loading-text">⏳ جاري رفع الصور، انتظر لحظة...</div>

        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold; background:#0c0c0c;">
        
        <button type="button" class="btn" style="background: linear-gradient(135deg, #16a34a, #15803d); margin-top:15px;" onclick="sendTo('client')">📱 1. إرسال للعميل</button>
        <button type="button" class="btn" style="background: linear-gradient(135deg, #2563eb, #1d4ed8);" onclick="sendTo('owner')">📋 2. إرسال للمحل</button>
        <button type="button" class="btn" style="background: linear-gradient(135deg, #dc2626, #b91c1c);" onclick="resetFormForNextInvoice()">➕ فاتورة جديدة (تصفير ورقم جديد)</button>
        
        <button type="button" class="btn" style="background: linear-gradient(135deg, #bf953f, #aa771c); color:#000;" onclick="rep('daily')">📊 تحميل التقرير اليومي</button>
        <button type="button" class="btn" style="background: linear-gradient(135deg, #0284c7, #0369a1); color:#fff;" onclick="rep('monthly')">📅 تحميل التقرير الشهري</button>
        <button type="button" class="btn" style="background: linear-gradient(135deg, #7c3aed, #5b21b6); color:#fff;" onclick="rep('yearly')">📈 تحميل التقرير السنوي</button>
        
        <a href="https://www.facebook.com/61560847583033" target="_blank" rel="noopener noreferrer" class="btn" style="background: linear-gradient(135deg, #1877f2, #0c4a6e);">
           🌐 السوشيال ميديا للمحل
        </a>

        <div class="manage-section">
            <h3 style="color:#bf953f; text-align:center; margin-top:0;">🔍 البحث وإدارة حالة الفواتير</h3>
            
            <label style="text-align: center; margin-bottom: 8px;">🔢 البحث برقم الأوردر (بسط ومقام):</label>
            <div style="background: #141414; padding: 15px; border: 1px solid #33270a; border-radius: 12px; margin-bottom: 10px; text-align: center;">
                <div style="display: inline-flex; flex-direction: column; width: 110px; vertical-align: middle; margin-bottom: 10px;">
                    <input type="number" id="searchNumerator" placeholder="رقم" style="text-align: center; padding: 8px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; font-weight: bold; color: #f3e5ab; font-size: 16px;">
                    <div style="background: #bf953f; height: 3px; width: 100%;"></div>
                    <div style="position: relative;">
                        <input type="number" id="searchDenominator" placeholder="اليوم" style="text-align: center; padding: 8px; border-top-left-radius: 0; border-top-right-radius: 0; font-weight: bold; color: #38bdf8; font-size: 16px;">
                    </div>
                </div>
                <button type="button" class="btn track-btn" style="width: 100%; margin-top: 5px;" onclick="searchByFractionNumber()">بحث برقم الأوردر</button>
            </div>

            <label>👤 أو البحث باسم العميل أو رقم الموبايل (للجديد والقديم):</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="searchInput" placeholder="الاسم أو الرقم..." style="margin-top:0; text-align: right;">
                <button type="button" class="btn track-btn" style="width: auto; margin-top:0; padding: 0 15px;" onclick="searchInvoices()">بحث بالاسم</button>
            </div>
            
            <div id="searchResults" class="result-box"></div>
        </div>
        
        <div class="notice-box">⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام .</div>

        <div class="footer-credits">
            جميع الحقوق محفوظه لي <span>المهندس مسعد سالم _ وسالم سعد</span>
        </div>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://ekozcfasqvuuikdjwmtj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qfv5sexqStJWEOJY0RxGkA_6iOiVVjf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var OWNER_PHONE = "201090274601"; 
    var uploadedImageUrls = [];
    var selectedFilesList = [];
    var currentDailyNum = 1;
    var currentDayNum = 1;
    var formattedOrderCode = "";
    var isCurrentInvoiceSaved = false;

    function initApp() {
        document.getElementById('rDate').value = '';
        document.getElementById('dDate').value = '';
        fetchNextInvoiceNum();
    }

    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }

    async function fetchNextInvoiceNum() {
        try {
            const today = new Date();
            currentDayNum = today.getDate();

            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            
            const { data, error } = await supabaseClient
                .from('invoices')
                .select('daily_number, created_at')
                .gte('created_at', todayStart.toISOString())
                .order('daily_number', { ascending: false })
                .limit(1);

            if (!error && data && data.length > 0 && data[0].daily_number) {
                currentDailyNum = parseInt(data[0].daily_number) + 1;
            } else {
                const { data: allToday } = await supabaseClient
                    .from('invoices')
                    .select('id, created_at')
                    .gte('created_at', todayStart.toISOString());
                
                currentDailyNum = (allToday ? allToday.length : 0) + 1;
            }
        } catch (e) {
            currentDailyNum = 1;
            currentDayNum = new Date().getDate();
        }

        formattedOrderCode = currentDailyNum + '/' + currentDayNum;

        document.getElementById('badge').innerHTML = 
            '<span>رقم أوردر اليوم الثابت:</span>' +
            '<span class="fraction" style="font-size: 16px;">' +
                '<span class="numerator">' + currentDailyNum + '</span>' +
                '<span class="denominator">' + currentDayNum + '</span>' +
            '</span>';
    }

    function handleImagesSelection(event) {
        const files = event.target.files;
        if (files && files.length > 0) {
            const previewContainer = document.getElementById('previewsContainer');
            previewContainer.innerHTML = '';
            
            selectedFilesList = [];
            for (let i = 0; i < files.length; i++) {
                selectedFilesList.push(files[i]);
            }
            
            uploadedImageUrls = [];

            selectedFilesList.forEach(function(file) {
                const img = document.createElement('img');
                img.className = 'preview-thumb';
                img.src = URL.createObjectURL(file);
                previewContainer.appendChild(img);
            });
        }
    }

    async function uploadAllImages() {
        if (uploadedImageUrls.length > 0 && uploadedImageUrls.length === selectedFilesList.length) {
            return uploadedImageUrls;
        }

        if (selectedFilesList.length === 0) {
            return [];
        }

        const statusEl = document.getElementById('uploadStatus');
        statusEl.innerText = '⏳ جاري رفع الصور (' + selectedFilesList.length + ' صور)، انتظر لحظة...';
        statusEl.style.display = 'block';

        let urls = [];

        try {
            for (let i = 0; i < selectedFilesList.length; i++) {
                const file = selectedFilesList[i];
                const fileName = 'inv_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substring(2, 7) + '.jpg';

                const { data, error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: true
                    });

                if (uploadError) {
                    throw new Error(uploadError.message);
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(fileName);

                if (!publicUrlData || !publicUrlData.publicUrl) {
                    throw new Error("فشل توليد رابط الصورة");
                }

                urls.push(publicUrlData.publicUrl);
            }

            uploadedImageUrls = urls;
            statusEl.innerText = "✅ تم رفع " + urls.length + " صورة بنجاح!";
            setTimeout(function() { statusEl.style.display = 'none'; }, 2000);
            return uploadedImageUrls;

        } catch (err) {
            console.error("Upload error:", err);
            statusEl.style.display = 'none';
            alert("❌ خطأ أثناء رفع الصور:\n" + err.message);
            return [];
        }
    }

    function getItemsSummary() {
        let items = [];
        const sk = document.getElementById('snk').value;
        const ss = document.getElementById('shs').value;
        const sl = document.getElementById('slp').value;
        const sn = document.getElementById('snd').value;
        const sg = document.getElementById('sng').value;
        const bg = document.getElementById('bags').value;

        if (parseInt(sk) > 0) items.push('كوتشيات: ' + sk);
        if (parseInt(ss) > 0) items.push('جزم: ' + ss);
        if (parseInt(sl) > 0) items.push('شبشب: ' + sl);
        if (parseInt(sn) > 0) items.push('صندل: ' + sn);
        if (parseInt(sg) > 0) items.push('فردة: ' + sg);
        if (parseInt(bg) > 0) items.push('شنط: ' + bg);

        return items.join(' | ') || 'صيانة متنوعة';
    }

    async function sendTo(m) {
        var n = document.getElementById('name').value.trim();
        var t = document.getElementById('tot').value.trim();
        var ph = document.getElementById('phone').value.trim();
        var shelf = document.getElementById('shelfLocation').value;

        if(!n || !t || (m === 'client' && !ph)) { 
            alert("يرجى ملء كافة البيانات المطلوبة!"); 
            return; 
        }

        var imgUrls = await uploadAllImages();

        if (selectedFilesList.length > 0 && imgUrls.length !== selectedFilesList.length) {
            alert("❌ لم يتم حفظ الفاتورة لأن رفع الصور لم يكتمل بالكامل.");
            return;
        }

        var imagesForDatabase = imgUrls.join('\n');

        var r = document.getElementById('rDate').value || 'غير محدد',
            d = document.getElementById('dDate').value || 'غير محدد',
            sk = document.getElementById('snk').value,
            ss = document.getElementById('shs').value,
            sl = document.getElementById('slp').value,
            sn = document.getElementById('snd').value,
            sg = document.getElementById('sng').value,
            bg = document.getElementById('bags').value,
            sv = document.getElementById('srv').value,
            p = document.getElementById('paid').value,
            rm = document.getElementById('rem').value;

        if (!isCurrentInvoiceSaved) {
            const { error } = await supabaseClient
                .from('invoices')
                .insert([{
                    customer_name: n,
                    phone: ph,
                    item_type: getItemsSummary() + ' | ' + shelf,
                    details: sv,
                    price: parseFloat(t) || 0,
                    paid: parseFloat(p) || 0,
                    image_url: imagesForDatabase,
                    status: 'تحت الصيانة',
                    daily_number: currentDailyNum
                }]);

            if (error) {
                alert("خطأ في حفظ الفاتورة: " + error.message);
                return;
            }

            isCurrentInvoiceSaved = true;
        }

        var baseTxt =
            '👤 *اسم العميل:* ' + n + '\n' +
            '📱 *رقم الموبايل:* ' + ph + '\n' +
            '📅 *تاريخ الاستلام:* ' + r + '\n' +
            '📦 *تاريخ التسليم:* ' + d + '\n\n' +
            '👟 *كوتشيات:* ' + sk + ' | 🥾 *جزم:* ' + ss + ' | 🩴 *شبشب:* ' + sl + '\n' +
            '👡 *صندل:* ' + sn + ' | 👞 *فردة:* ' + sg + ' | 💼 *شنط:* ' + bg + '\n' +
            '🛠️ *الخدمة:* ' + sv + '\n\n' +
            '💰 *الحساب الكلي:* ' + t + ' جنيه\n' +
            '💵 *المدفوع مقدمًا:* ' + p + ' جنيه\n' +
            '🔴 *المبلغ المتبقي:* ' + rm + ' جنيه';

        if (m === 'client') {
            var cleanPh = ph.replace(/\D/g, '');
            if (cleanPh.startsWith("0")) {
                cleanPh = "2" + cleanPh;
            }

            var msg =
                '✨ *ALESKAFY SHOES* ✨\n' +
                '🧾 *إيصال استلام صيانة*\n\n' +
                baseTxt +
                '\n\n⚠️ *تنبيه:* المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد التسليم.' +
                '\n\n━━━━━━━━━━━━━━━\n' +
                '🌐 تابع صفحة المحل على فيسبوك:\n' +
                'https://www.facebook.com/61560847583033\n\n' +
                '❤️ شكراً لزيارتكم ونتشرف بخدمتكم دائماً.';

            window.open("https://wa.me/" + cleanPh + "?text=" + encodeURIComponent(msg), "_blank");

        } else {
            let imagesText = "";
            if (imgUrls.length > 0) {
                imagesText = "\n\n🖼️ *رابط الصور:*";
                imgUrls.forEach(function(url, index) {
                    imagesText += '\n' + url;
                });
            } else {
                imagesText = "\n\n🖼️ *رابط الصور:* لا توجد صور.";
            }

            // تم إرجاع سطر الأوردر والرف بوضوح هنا، مع استبعاد الجملة التكرارية القديمة
            var oMsg =
                '📥 *[ALESKAFY SHOES - نسخة المحل]*\n' +
                '🧾 *أرشيف أوردر رقم (' + formattedOrderCode + ') على (' + shelf + ')*\n\n' +
                baseTxt +
                imagesText;

            window.open("https://wa.me/" + OWNER_PHONE + "?text=" + encodeURIComponent(oMsg), "_blank");
        }
    }

    async function resetFormForNextInvoice() {
        document.getElementById('invoiceForm').reset();
        document.getElementById('previewsContainer').innerHTML = '';
        document.getElementById('uploadStatus').style.display = 'none';
        uploadedImageUrls = [];
        selectedFilesList = [];
        isCurrentInvoiceSaved = false;

        document.getElementById('rDate').value = '';
        document.getElementById('dDate').value = '';

        await fetchNextInvoiceNum();
        alert("جاهز للفاتورة الجديدة 👍");
    }

    async function rep(type) {
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const currentMonthNum = now.getMonth();
        const currentYearNum = now.getFullYear();

        const { data: list, error } = await supabaseClient
            .from('invoices')
            .select('*');

        if (error || !list || list.length === 0) {
            alert("لا توجد فواتير مسجلة!");
            return;
        }
        
        let totalCreatedPrice = 0;
        let totalCollectedPaid = 0;
        let totalRemainingAll = 0;
        let matchedCount = 0;

        let titleText = '';
        if (type === 'daily') {
            titleText = '📊 تقرير الإسكافي شوز اليومي (' + todayStr + ')';
        } else if (type === 'monthly') {
            titleText = '📅 تقرير الإسكافي شوز الشهري (شهر ' + (currentMonthNum + 1) + ' لسنة ' + currentYearNum + ')';
        } else {
            titleText = '📈 تقرير الإسكافي شوز السنوي (سنة ' + currentYearNum + ')';
        }

        let txt = titleText + '\n====================\n\n';

        list.forEach(function(x) {
            var price = x.price || 0;
            var paid = x.paid || 0;
            var rem = price - paid;
            var codeNum = x.daily_number || 1;
            let invDate = new Date(x.created_at || Date.now());
            var dayNum = invDate.getDate() || 1;
            
            totalRemainingAll += rem;

            let invDateStr = invDate.toISOString().slice(0, 10);
            let invMonth = invDate.getMonth();
            let invYear = invDate.getFullYear();

            let includeFlag = false;
            if (type === 'daily' && invDateStr === todayStr) {
                includeFlag = true;
            } else if (type === 'monthly' && invMonth === currentMonthNum && invYear === currentYearNum) {
                includeFlag = true;
            } else if (type === 'yearly' && invYear === currentYearNum) {
                includeFlag = true;
            }
            
            if (includeFlag) {
                matchedCount++;
                totalCreatedPrice += price;
                totalCollectedPaid += paid;

                txt += 'أوردر (' + codeNum + '/' + dayNum + ') - العميل: ' + x.customer_name + ' | التاريخ: ' + invDateStr + '\n';
                txt += 'الحساب: ' + price + ' ج | المدفوع: ' + paid + ' ج | الباقي: ' + rem + ' ج\n';
                txt += '--------------------\n';
            }
        });

        if (matchedCount === 0) {
            txt += 'لا توجد فواتير مسجلة في هذه الفترة.\n';
        }

        txt += "\n====================\n";
        txt += '📈 عدد الفواتير في الفترة: ' + matchedCount + '\n';
        txt += '💰 إجمالي المبيعات: ' + totalCreatedPrice + ' ج\n';
        txt += '💵 إجمالي النقدية المحصولة: ' + totalCollectedPaid + ' ج\n';
        txt += '🔴 إجمالي المتبقي المتراكم (لكل العملاء): ' + totalRemainingAll + ' ج';

        var b = new Blob(["\uFEFF" + txt], { type: "text/plain;charset=utf-8" });
        var lnk = document.createElement('a');
        lnk.href = URL.createObjectURL(b);
        lnk.download = "Report_" + type + "_" + todayStr + ".txt";
        document.body.appendChild(lnk);
        lnk.click();
        document.body.removeChild(lnk);
        URL.revokeObjectURL(lnk.href);
    }

    async function searchByFractionNumber() {
        const numVal = parseInt(document.getElementById('searchNumerator').value.trim());
        const dayVal = parseInt(document.getElementById('searchDenominator').value.trim());
        const resBox = document.getElementById('searchResults');

        if (isNaN(numVal) || isNaN(dayVal)) {
            alert('الرجاء إدخال رقم الأوردر فوق وتاريخ اليوم تحت بشكل صحيح');
            return;
        }

        resBox.style.display = 'block';
        resBox.innerHTML = 'جاري البحث... ⏳';

        const targetDateStart = new Date();
        targetDateStart.setDate(dayVal);
        targetDateStart.setHours(0, 0, 0, 0);

        const targetDateEnd = new Date(targetDateStart);
        targetDateEnd.setHours(23, 59, 59, 999);

        const { data, error } = await supabaseClient
            .from('invoices')
            .select('*')
            .gte('created_at', targetDateStart.toISOString())
            .lte('created_at', targetDateEnd.toISOString())
            .eq('daily_number', numVal);

        renderSearchResults(data, error, resBox);
    }

    async function searchInvoices() {
        const query = document.getElementById('searchInput').value.trim();
        const resBox = document.getElementById('searchResults');

        if (!query) {
            alert('أدخل اسم العميل أو رقم الموبايل للبحث');
            return;
        }

        resBox.style.display = 'block';
        resBox.innerHTML = 'جاري البحث في الفواتير القديمة والجديدة... ⏳';

        const { data, error } = await supabaseClient
            .from('invoices')
            .select('*')
            .or('customer_name.ilike.%' + query + '%,phone.ilike.%' + query + '%')
            .order('created_at', { ascending: false });

        renderSearchResults(data, error, resBox);
    }

    function renderSearchResults(data, error, resBox) {
        if (error || !data || data.length === 0) {
            resBox.innerHTML = '<div style="color: #ef4444; text-align: center;">لا توجد فواتير مطابقة بالاسم أو الرقم ده!</div>';
            return;
        }

        resBox.innerHTML = data.map(function(inv) {
            const isDone = inv.status === 'تم الانتهاء من الصيانة';
            const statusClass = isDone ? 'bg-done' : 'bg-pending';
            const price = inv.price || 0;
            const paid = inv.paid || 0;
            const rem = price - paid;
            const phoneVal = inv.phone || '-';
            const itemType = inv.item_type || '-';
            const details = inv.details || '-';
            
            let invDate = new Date(inv.created_at || Date.now());
            let numTop = inv.daily_number || '#';
            let numBottom = invDate.getDate();

            let fractionHtml = 
                '<span class="fraction" style="font-size: 14px;">' +
                    '<span class="numerator">' + numTop + '</span>' +
                    '<span class="denominator">' + numBottom + '</span>' +
                '</span>';

            let imageLinks = '';
            if (inv.image_url) {
                const imageUrls = String(inv.image_url).split(/\r?\n/).map(function(url) { return url.trim(); }).filter(function(url) { return url.length > 1; });
                imageLinks = imageUrls.map(function(url, index) {
                    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#bf953f; font-size:12px; display:inline-block; margin-left:8px; margin-top:4px; text-decoration:none;">🖼️ عرض صورة ' + (index + 1) + '</a>';
                }).join('');
            }

            let payStatusText = rem > 0 ? 
                '<span style="color:#ef4444;">متبقي عليه (' + rem + ' ج)</span>' : 
                '<span style="color:#16a34a;">تم سداد المبلغ بالكامل ✅</span>';

            return '<div style="border-bottom: 1px dashed #33270a; padding-bottom: 12px; margin-bottom: 12px;">' +
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">' +
                    '<strong style="color: #f3e5ab; font-size: 15px;">👤 ' + inv.customer_name + '</strong>' +
                    '<span class="status-badge ' + statusClass + '">' + (inv.status || 'تحت الصيانة') + '</span>' +
                '</div>' +
                '<div style="font-size: 13px; color: #38bdf8; margin-bottom: 3px; display:flex; align-items:center; gap:6px;">' +
                    '🔢 <b>رقم اليوم:</b> ' + fractionHtml +
                '</div>' +
                '<div style="font-size: 13px; color: #cbd5e1; margin-bottom: 3px;">📱 الموبايل: ' + phoneVal + '</div>' +
                '<div style="font-size: 13px; color: #e2e8f0; margin-bottom: 3px;">👟 <b>الأصناف:</b> ' + itemType + '</div>' +
                '<div style="font-size: 13px; color: #e2e8f0; margin-bottom: 3px;">🛠️ <b>الخدمة:</b> ' + details + '</div>' +
                '<div style="font-size: 13px; margin-bottom: 4px;">💰 الحساب: ' + price + ' ج | 💵 المدفوع: ' + paid + ' ج | 🔴 المتبقي: <span style="color:#ef4444; font-weight:bold;">' + rem + ' ج</span></div>' +
                '<div style="margin-bottom: 6px;">' + imageLinks + '</div>' +
                
                '<div style="margin-top: 10px; padding: 10px; background: #1a1500; border: 1px solid #bf953f; border-radius: 8px;">' +
                    '<div style="font-size: 13px; color: #f3e5ab; margin-bottom: 6px; font-weight: bold;">' +
                        '💳 حالة الدفع: ' + payStatusText +
                    '</div>' +
                    '<div style="display:flex; gap:6px;">' +
                        '<button type="button" class="btn-sm" style="background:#16a34a; color:#fff; flex:1;" onclick="updatePaymentStatus(' + inv.id + ', ' + price + ', 0)">✅ تم سداد المبلغ</button>' +
                        '<button type="button" class="btn-sm" style="background:#d97706; color:#fff; flex:1;" onclick="updatePaymentStatus(' + inv.id + ', ' + price + ', ' + (rem > 0 ? rem : price) + ')">⏳ لم يتم السداد</button>' +
                    '</div>' +
                '</div>' +

                '<div style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed #221a05; background: #0c0c0c; padding: 6px; border-radius: 6px;">' +
                    '<input type="file" id="updateFile_' + inv.id + '" accept="image/*" multiple style="font-size:11px; margin-bottom:4px; padding:4px;">' +
                    '<button type="button" class="btn-sm" style="background:#bf953f; color:#000; width:100%;" onclick="uploadImageForExistingInvoice(' + inv.id + ')">📷 رفع وإضافة صور لهذه الفاتورة</button>' +
                '</div>' +

                '<div style="display:flex; gap:6px; margin-top:8px;">' +
                    '<button type="button" class="btn-sm" style="background:#16a34a; color:#fff;" onclick="updateStatus(' + inv.id + ', \'تم الانتهاء من الصيانة\')">✅ تم الانتهاء</button>' +
                    '<button type="button" class="btn-sm" style="background:#d97706; color:#fff;" onclick="updateStatus(' + inv.id + ', \'تحت الصيانة\')">⏳ تحت الصيانة</button>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    async function updatePaymentStatus(invoiceId, totalPrice, targetRem) {
        let newPaid = (targetRem === 0) ? totalPrice : (totalPrice - targetRem);

        const { error } = await supabaseClient
            .from('invoices')
            .update({ 
                paid: newPaid
            })
            .eq('id', invoiceId);

        if (!error) {
            alert("✅ تم تحديث حالة السداد بنجاح 👍");
            
            const searchVal = document.getElementById('searchInput').value.trim();
            if(searchVal !== '') {
                searchInvoices();
            } else if(document.getElementById('searchNumerator').value.trim() !== '') {
                searchByFractionNumber();
            }
        } else {
            alert("❌ حدث خطأ أثناء التحديث!");
        }
    }

    async function uploadImageForExistingInvoice(invoiceId) {
        const fileInput = document.getElementById('updateFile_' + invoiceId);
        if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
            alert("اختر صورة أو صور أولاً!");
            return;
        }

        const files = fileInput.files;
        let newUrls = [];

        try {
            alert("⏳ جاري رفع الصور، انتظر ثوانٍ...");
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = 'inv_' + invoiceId + '_' + Date.now() + '_' + i + '.jpg';

                const { error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: true
                    });

                if (uploadError) throw new Error(uploadError.message);

                const { data: publicUrlData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(fileName);

                if (publicUrlData && publicUrlData.publicUrl) {
                    newUrls.push(publicUrlData.publicUrl);
                }
            }

            const { data: currentInv } = await supabaseClient
                .from('invoices')
                .select('image_url')
                .eq('id', invoiceId)
                .single();

            let existingUrls = (currentInv && currentInv.image_url) ? String(currentInv.image_url).split(/\r?\n/).map(function(u) { return u.trim(); }).filter(function(u) { return u.length > 1; }) : [];
            let combinedUrls = existingUrls.concat(newUrls).join('\n');

            const { error: updateError } = await supabaseClient
                .from('invoices')
                .update({ image_url: combinedUrls })
                .eq('id', invoiceId);

            if (updateError) throw new Error(updateError.name);

            alert("✅ تم إضافة الصور وتحديث الفاتورة بنجاح!");
            
            const searchVal = document.getElementById('searchInput').value.trim();
            if(searchVal !== '') {
                searchInvoices();
            } else if(document.getElementById('searchNumerator').value.trim() !== '') {
                searchByFractionNumber();
            }

        } catch (err) {
            console.error(err);
            alert("❌ خطأ أثناء رفع الصور: " + err.message);
        }
    }

    async function updateStatus(id, newStatus) {
        const { error } = await supabaseClient.from('invoices').update({ status: newStatus }).eq('id', id);
        if (!error) {
            alert('تم تغيير حالة الفاتورة بنجاح 👍');
            const searchVal = document.getElementById('searchInput').value.trim();
            if(searchVal !== '') {
                searchInvoices();
            } else if(document.getElementById('searchNumerator').value.trim() !== '') {
                searchByFractionNumber();
            }
        } else {
            alert('حدث خطأ أثناء التحديث!');
        }
    }
</script>
