<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES - نظام إدارة الأوردرات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; direction: rtl; padding: 20px; }
        .container { max-width: 600px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 16px; }
        .btn-whatsapp { background: #25d366; }
        .btn-whatsapp:hover { background: #1ebe5d; }
        .btn-reset { background: #e74c3c; }
        .btn-reset:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>ALESKAFY SHOES</h2>
    
    <div class="form-group">
        <label>اسم العميل:</label>
        <input type="text" id="customerName" placeholder="أدخل اسم العميل...">
    </div>

    <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="text" id="customerPhone" placeholder="أدخل رقم الهاتف...">
    </div>

    <div class="form-group">
        <label>الحساب الكلي (جنيه):</label>
        <input type="number" id="totalPrice" value="0">
    </div>

    <div class="form-group">
        <label>المدفوع مقدماً (جنيه):</label>
        <input type="number" id="paidAmount" value="0">
    </div>

    <div class="btn-group">
        <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">إرسال للواتساب فوراً 🚀</button>
        <button type="button" class="btn-reset" onclick="resetOrderData()">تحديث الصفحة 🔄</button>
    </div>
</div>

<script>
    // عند فتح الصفحة أو عمل Refresh يتم مسح أي بيانات قديمة لتبدأ الصفحة نظيفة تماماً
    window.addEventListener('DOMContentLoaded', () => {
        localStorage.clear(); // مسح الذاكرة المؤقتة تماماً عند أي Refresh
        clearAllInputs();
    });

    // دالة تفريغ الحقول
    function clearAllInputs() {
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('totalPrice').value = '0';
        document.getElementById('paidAmount').value = '0';
    }

    // دالة الإرسال السريع للواتساب مع الرموز السليمة
    function sendToWhatsApp() {
        const name = document.getElementById('customerName').value.trim() || "عميل عام";
        const phone = document.getElementById('customerPhone').value.trim();
        const total = document.getElementById('totalPrice').value;
        const paid = document.getElementById('paidAmount').value;
        const remaining = total - paid;

        // صياغة الرسالة بالرموز السليمة والمنسقة
        let message = `🔹 [ALESKAFY SHOES] 🔹\n`;
        message += `👤 اسم العميل: ${name}\n`;
        message += `💰 الحساب الكلي: ${total} جنيه\n`;
        message += `💵 المدفوع مقدماً: ${paid} جنيه\n`;
        message += `📌 المبلغ المتبقي: ${remaining} جنيه\n`;
        message += `✨ ترحيب بكم دائماً في الإسكافي شوز ✨`;

        // فتح الواتساب بسرعة فائقة وبدون أي تأخير
        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
        
        window.open(whatsappUrl, '_blank');
    }

    // زر التحديث اليدوي أو تصفير الشاشة
    function resetOrderData() {
        localStorage.clear();
        location.reload(); // تحديث نظيف وسريع للصفحة
    }
</script>

</body>
</html>
