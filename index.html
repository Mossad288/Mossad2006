<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES - نظام إدارة الورشة</title>
    <!-- تضمين مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- تضمين الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --accent: #27ae60;
            --danger: #c0392b;
            --light: #f8f9fa;
            --dark: #2c3e50;
            --border: #dcdde1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f1f2f6;
            color: #333;
            direction: rtl;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1a252f);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.85rem;
            color: #bdc3c7;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--secondary);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success { background-color: var(--accent); }
        .btn-danger { background-color: var(--danger); }
        .btn-dark { background-color: var(--primary); }

        #auth-screen {
            max-width: 400px;
            margin: 80px auto;
        }

        .hidden {
            display: none !important;
        }

        .order-badge {
            background: #e1b12c;
            color: #2f3640;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .orders-list {
            margin-top: 15px;
        }

        .order-item {
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .order-info h4 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 3px;
        }

        .order-info p {
            font-size: 0.85rem;
            color: #666;
        }

        .order-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: white;
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--border);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview-thumb {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        @media(max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ALESKAFY SHOES</h1>
        <p>نظام إبادة المشاكل وإدارة ورشة الأحذية الذكي</p>
    </header>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="container">
        <div class="card">
            <h2><i class="fa-solid fa-lock"></i> تسجيل الدخول</h2>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="auth-pass" class="form-control" placeholder="أدخل كلمة المرور...">
            </div>
            <button class="btn" onclick="checkAuth()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-screen" class="container hidden">
        
        <div class="top-nav">
            <span id="user-role-badge" class="order-badge">مدير النظام</span>
            <button class="btn btn-danger" style="width: auto; padding: 6px 15px; font-size: 0.85rem;" onclick="logout()">
                <i class="fa-solid fa-power-off"></i> خروج
            </button>
        </div>

        <!-- قسم إضافة أوردر جديد -->
        <div class="card" id="new-order-card">
            <h2>
                <span><i class="fa-solid fa-plus-circle"></i> أوردر جديد</span>
                <span id="daily-order-num" class="order-badge">أوردر رقم: --</span>
            </h2>
            
            <div class="row">
                <div class="form-group col">
                    <label>اسم العميل:</label>
                    <input type="text" id="cust-name" class="form-control" placeholder="اسم العميل الكريم">
                </div>
                <div class="form-group col">
                    <label>رقم الموبايل:</label>
                    <input type="tel" id="cust-phone" class="form-control" placeholder="010xxxxxxxx">
                </div>
            </div>

            <div class="row">
                <div class="form-group col">
                    <label>نوع الحذاء / القطعة:</label>
                    <input type="text" id="item-type" class="form-control" placeholder="مثال: كوتش، حذاء كلاسيك، شنطة...">
                </div>
                <div class="form-group col">
                    <label>نوع الإصلاح المطلوب:</label>
                    <input type="text" id="repair-desc" class="form-control" placeholder="مثال: خياطة نعل، لزق، توسيع...">
                </div>
            </div>

            <div class="row">
                <div class="form-group col">
                    <label>الإجمالي (جيم):</label>
                    <input type="number" id="total-price" class="form-control" placeholder="0" oninput="calcRemaining()">
                </div>
                <div class="form-group col">
                    <label>المدفوع (مقدم):</label>
                    <input type="number" id="paid-price" class="form-control" placeholder="0" oninput="calcRemaining()">
                </div>
                <div class="form-group col">
                    <label>المتبقي:</label>
                    <input type="number" id="remaining-price" class="form-control" readonly placeholder="0" style="background: #e9ecef;">
                </div>
            </div>

            <div class="form-group">
                <label>مكان التخزين (الرف / الدولاب):</label>
                <input type="text" id="storage-loc" class="form-control" placeholder="مثال: رف أ - القسم الأيمن">
            </div>

            <div class="form-group">
                <label>صور القطعة (قبل الإصلاح):</label>
                <input type="file" id="item-images" class="form-control" accept="image/*" multiple onchange="previewImages()">
                <div id="images-preview" class="image-preview-container"></div>
            </div>

            <button class="btn btn-success" onclick="saveOrder()"><i class="fa-solid fa-floppy-disk"></i> حفظ وطباعة الإيصال / واتساب</button>
        </div>

        <!-- قسم البحث وعرض الأوردرات -->
        <div class="card">
            <h2><span><i class="fa-solid fa-list-check"></i> الفواتير الحالية</span></h2>
            
            <div class="form-group">
                <input type="text" id="search-box" class="form-control" placeholder="بحث برقم الفاتورة، اسم العميل، أو الموبايل..." oninput="filterOrders()">
            </div>

            <div id="orders-container" class="orders-list">
                <!-- يتم حقن الفواتير هنا برمجياً -->
            </div>
        </div>

    </div>

    <script>
        // إعدادات Supabase الخاصة بك
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = '';
        let uploadedFiles = [];

        function checkAuth() {
            const pass = document.getElementById('auth-pass').value.trim();
            if (pass === '1234') {
                currentRole = 'admin';
                initApp();
            } else if (pass === '5678') {
                currentRole = 'worker';
                initApp();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function initApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            
            if (currentRole === 'worker') {
                document.getElementById('new-order-card').classList.add('hidden');
                document.getElementById('user-role-badge').innerText = 'صنايعي (عرض وفحص)';
            } else {
                document.getElementById('user-role-badge').innerText = 'مدير النظام (إدارة كاملة)';
                generateOrderNumber();
            }
            loadOrders();
        }

        function logout() {
            location.reload();
        }

        function calcRemaining() {
            const total = parseFloat(document.getElementById('total-price').value) || 0;
            const paid = parseFloat(document.getElementById('paid-price').value) || 0;
            document.getElementById('remaining-price').value = total - paid;
        }

        function generateOrderNumber() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB').replace(/\//g, '');
            document.getElementById('daily-order-num').innerText = `أوردر رقم: 1 / ${dateStr}`;
        }

        function previewImages() {
            const previewContainer = document.getElementById('images-preview');
            previewContainer.innerHTML = '';
            const files = document.getElementById('item-images').files;
            uploadedFiles = files;

            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-thumb';
                    previewContainer.appendChild(img);
                }
                reader.readAsDataURL(files[i]);
            }
        }

        function saveOrder() {
            alert('جاهز لحفظ الفاتورة في جدول invoices في Supabase!');
        }

        function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = `<p style="text-align:center; color:#888;">جاري تحميل الفواتير...</p>`;
        }

        // دالة تسجيل التسليم المتوافقة مع جدول invoices وتاريخ التسليم (delivered_at)
        async function markAsDelivered(invoiceId) {
            // الحصول على تاريخ اليوم بتوقيت مصر المحلى بصيغة YYYY-MM-DD
            const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });

            const { data, error } = await supabase
                .from('invoices') // اسم جدولك الفعلي في السحابة
                .update({ 
                    status: 'تم التسليم',        // تحديث الحالة في عمود status
                    delivered_at: todayStr      // تسجيل تاريخ النهاردة ليظهر في "المسلم اليوم" وتقرير اليوم
                })
                .eq('id', invoiceId);

            if (error) {
                alert('حدث خطأ أثناء تحديث حالة التسليم: ' + error.message);
                console.error(error);
            } else {
                alert('تم تسجيل التسليم بنجاح، وظهر في تقرير اليوم وقائمة المستلمين اليوم!');
                loadOrders(); // إعادة تحميل القائمة لتحديث الشاشة
            }
        }

        function filterOrders() {
            // دالة البحث والفلترة
        }
    </script>
</body>
</html>
