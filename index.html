<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0f19; margin: 0; padding: 15px; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 430px; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #f59e0b; display: block; }
        h1 { text-align: center; color: #f59e0b; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; font-size: 14px; width: 100%; box-sizing: border-box;}
        
        /* تصميم البسط والمقام الحقيقي (فوق بعض بخط فاصل) */
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-weight: bold; line-height: 1.1; }
        .fraction .numerator { border-bottom: 2px solid currentColor; padding-bottom: 1px; }
        .fraction .denominator { padding-top: 1px; }

        label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #334155; border-radius: 6px; background: #1f2937; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; } .row div { flex: 1; min-width: 30%; }
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .notice-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; text-align: center; font-size: 13px; color: #fca5a5; }
        
        .camera-btn { background: #8b5cf6; color: #fff; }
        .track-btn { background: #06b6d4; color: #fff; }
        
        #previewsContainer { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; max-height: 160px; overflow-y: auto; padding: 5px; background: #1f2937; border-radius: 8px; border: 1px solid #334155; }
        .preview-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 6px; border: 2px solid #f59e0b; flex-shrink: 0; }

        .manage-section { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #f59e0b; }
        .result-box { margin-top: 10px; padding: 10px; background: #1f2937; border-radius: 8px; border: 1px solid #334155; font-size: 13px; display: none; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .bg-pending { background: #d97706; color: white; }
        .bg-done { background: #16a34a; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .loading-text { color: #f59e0b; font-size: 13px; text-align: center; margin-top: 8px; font-weight: bold; display: none; }
    </style>
</head>
<body onload="initApp();">

<div class="container" id="mainApp">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <div class="badge" id="badge">رقم الأوردر: جاري التحميل...</div>
    </div>

    <form id="invoiceForm">
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل:</label><input type="tel" id="phone" placeholder="01012345678">
        
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
            <div><label>🩴 شبشب:</label><input type="number" id="slp" value="0"></div>
        </div>
        
        <div class="row">
            <div><label>👡 صندل:</label><input type="number" id="snd" value="0"></div>
            <div><label>👞 فردة:</label><input type="number" id="sng" value="0"></div>
            <div><label>💼 شنط:</label><input type="number" id="bags" value="0"></div>
        </div>
        
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">

        <label>🗄️ مكان التخزين (الرف بالمحل):</label>
        <select id="shelfLocation">
            <option value="رف أ">رف (أ)</option>
            <option value="رف ب">رف (ب)</option>
            <option value="رف ج">رف (ج)</option>
            <option value="رف د">رف (د)</option>
            <option value="رف هـ">رف (هـ)</option>
            <option value="رف و">رف (و)</option>
        </select>
        
        <label>📷 تصوير القطع قبل الصيانة (حدد أكثر من صورة دفعة واحدة):</label>
        <input type="file" id="itemImages" accept="image/*" multiple style="display:none;" onchange="handleImagesSelection(event)">
        <button type="button" class="btn camera-btn" onclick="document.getElementById('itemImages').click();">📷 تصوير / اختيار عدة صور</button>
        
        <div id="previewsContainer"></div>
        <div id="uploadStatus" class="loading-text">⏳ جاري رفع الصور، انتظر لحظة...</div>

        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold; background:#111827;">
        
        <button type="button" class="btn" style="background:#22c55e; margin-top:15px;" onclick="sendTo('client')">📱 1. إرسال للعميل</button>
        <button type="button" class="btn" style="background:#3b82f6;" onclick="sendTo('owner')">📋 2. إرسال للمحل</button>
        <button type="button" class="btn" style="background:#dc2626;" onclick="resetFormForNextInvoice()">➕ فاتورة جديدة (تصفير ورقم جديد)</button>
        <button type="button" class="btn" style="background:#f59e0b; color:#000;" onclick="rep()">📊 تحميل التقرير اليومي</button>
        
        <a href="https://www.facebook.com/61560847583033" target="_blank" rel="noopener noreferrer" class="btn" style="background:#1877f2;">
           🌐 السوشيال ميديا للمحل
        </a>

        <div class="manage-section">
            <h3 style="color:#f59e0b; text-align:center; margin-top:0;">🔍 البحث وإدارة حالة الفواتير</h3>
            
            <!-- بحث برقم الأوردر (رقم اليوم التلقائي) -->
            <label>🔢 البحث برقم الأوردر (مثلاً اكتب 1 أو 2):</label>
            <div style="display:flex; gap:5px; margin-bottom: 10px;">
                <input type="number" id="dailySearchInput" placeholder="رقم الأوردر اليومي..." style="margin-top:0;">
                <button type="button" class="btn track-btn" style="width: auto; margin-top:0; padding: 0 15px;" onclick="searchByDailyNumber()">بحث بالرقم</button>
            </div>

            <!-- بحث باسم العميل أو رقم الموبايل -->
            <label>👤 أو البحث باسم العميل أو رقم الموبايل:</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="searchInput" placeholder="الاسم أو الرقم..." style="margin-top:0;">
                <button type="button" class="btn track-btn" style="width: auto; margin-top:0; padding: 0 15px;" onclick="searchInvoices()">بحث بالاسم</button>
            </div>
            
            <div id="searchResults" class="result-box"></div>
        </div>
        
        <div class="notice-box">⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام .</div>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://ekozcfasqvuuikdjwmtj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qfv5sexqStJWEOJY0RxGkA_6iOiVVjf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var OWNER_PHONE = "201090274601"; 
    var uploadedImageUrls = [];
    var selectedFilesList = [];
    var currentDailyNum = 1;
    var currentDayNum = 23;
    var formattedOrderCode = "";
    var isCurrentInvoiceSaved = false;

    function initApp() {
        const today = new Date();
        document.getElementById('rDate').valueAsDate = today;
        fetchNextInvoiceNum();
    }

    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }

    async function fetchNextInvoiceNum() {
        try {
            const today = new Date();
            currentDayNum = today.getDate(); // رقم اليوم الحالي تلقائياً

            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            
            const { data, error } = await supabaseClient
                .from('invoices')
                .select('id, daily_num')
                .gte('created_at', todayStart.toISOString());

            if (!error && data) {
                currentDailyNum = data.length + 1;
            } else {
                currentDailyNum = 1;
            }

            formattedOrderCode = `${currentDailyNum}/${currentDayNum}`;
        } catch (e) {
            currentDailyNum = 1;
            currentDayNum = new Date().getDate();
            formattedOrderCode = `${currentDailyNum}/${currentDayNum}`;
        }

        // عرض الرقم بشكل كسر حقيقي (بسط فوق ومقام تحت) في واجهة التطبيق
        document.getElementById('badge').innerHTML = `
            <span>رقم أوردر اليوم التلقائي:</span>
            <span class="fraction" style="font-size: 16px;">
                <span class="numerator">${currentDailyNum}</span>
                <span class="denominator">${currentDayNum}</span>
            </span>
        `;
    }

    function handleImagesSelection(event) {
        const files = event.target.files;
        if (files && files.length > 0) {
            const previewContainer = document.getElementById('previewsContainer');
            previewContainer.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                selectedFilesList.push(files[i]);
            }
            
            uploadedImageUrls = [];

            selectedFilesList.forEach((file, index) => {
                const img = document.createElement('img');
                img.className = 'preview-thumb';
                img.src = URL.createObjectURL(file);
                previewContainer.appendChild(img);
            });
        }
    }

    async function uploadAllImages() {
        if (uploadedImageUrls.length > 0 && uploadedImageUrls.length === selectedFilesList.length) {
            return uploadedImageUrls;
        }

        if (selectedFilesList.length === 0) {
            return [];
        }

        const statusEl = document.getElementById('uploadStatus');
        statusEl.innerText = `⏳ جاري رفع الصور (${selectedFilesList.length} صور)، انتظر لحظة...`;
        statusEl.style.display = 'block';

        let urls = [];

        try {
            for (let i = 0; i < selectedFilesList.length; i++) {
                const file = selectedFilesList[i];
                const extension = file.name && file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : 'jpg';
                const safeExtension = ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(extension) ? extension : 'jpg';
                const fileName = `invoice_${Date.now()}_${i}_${Math.random().toString(36).substring(2, 8)}.${safeExtension}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: false,
                        contentType: file.type || 'image/jpeg'
                    });

                if (uploadError) {
                    throw new Error("فشل رفع الصورة رقم " + (i + 1) + ": " + uploadError.message);
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(fileName);

                if (!publicUrlData || !publicUrlData.publicUrl) {
                    throw new Error("لم يتم إنشاء رابط للصورة رقم " + (i + 1));
                }

                urls.push(publicUrlData.publicUrl);
            }

            uploadedImageUrls = urls;
            statusEl.innerText = "✅ تم رفع " + urls.length + " صورة بنجاح!";
            setTimeout(() => { statusEl.style.display = 'none'; }, 2500);
            return uploadedImageUrls;

        } catch (err) {
            console.error("Upload exception:", err);
            statusEl.style.display = 'none';
            alert("❌ حصل خطأ في رفع الصور:\n\n" + err.message);
            return [];
        }
    }

    function getItemsSummary() {
        let items = [];
        const sk = document.getElementById('snk').value;
        const ss = document.getElementById('shs').value;
        const sl = document.getElementById('slp').value;
        const sn = document.getElementById('snd').value;
        const sg = document.getElementById('sng').value;
        const bg = document.getElementById('bags').value;

        if (parseInt(sk) > 0) items.push(`كوتشيات: ${sk}`);
        if (parseInt(ss) > 0) items.push(`جزم: ${ss}`);
        if (parseInt(sl) > 0) items.push(`شبشب: ${sl}`);
        if (parseInt(sn) > 0) items.push(`صندل: ${sn}`);
        if (parseInt(sg) > 0) items.push(`فردة: ${sg}`);
        if (parseInt(bg) > 0) items.push(`شنط: ${bg}`);

        return items.join(' | ') || 'صيانة متنوعة';
    }

    async function sendTo(m) {
        var n = document.getElementById('name').value.trim();
        var t = document.getElementById('tot').value.trim();
        var ph = document.getElementById('phone').value.trim();
        var shelf = document.getElementById('shelfLocation').value;

        if(!n || !t || (m === 'client' && !ph)) { 
            alert("يرجى ملء كافة البيانات المطلوبة!"); 
            return; 
        }

        var imgUrls = await uploadAllImages();

        if (selectedFilesList.length > 0 && imgUrls.length !== selectedFilesList.length) {
            alert("❌ لم يتم حفظ الفاتورة لأن رفع الصور لم يكتمل بالكامل.");
            return;
        }

        var imagesForDatabase = imgUrls.join('\n');

        var r = document.getElementById('rDate').value,
            d = document.getElementById('dDate').value,
            sk = document.getElementById('snk').value,
            ss = document.getElementById('shs').value,
            sl = document.getElementById('slp').value,
            sn = document.getElementById('snd').value,
            sg = document.getElementById('sng').value,
            bg = document.getElementById('bags').value,
            sv = document.getElementById('srv').value,
            p = document.getElementById('paid').value,
            rm = document.getElementById('rem').value;

        if (!isCurrentInvoiceSaved) {
            const { error } = await supabaseClient
                .from('invoices')
                .insert([{
                    customer_name: n,
                    phone: ph,
                    item_type: getItemsSummary(),
                    details: sv,
                    price: parseFloat(t) || 0,
                    paid: parseFloat(p) || 0,
                    image_url: imagesForDatabase,
                    status: 'تحت الصيانة',
                    daily_num: currentDailyNum,
                    order_code: formattedOrderCode,
                    shelf: shelf
                }]);

            if (error) {
                alert("خطأ في حفظ الفاتورة: " + error.message);
                return;
            }

            isCurrentInvoiceSaved = true;
        }

        var baseTxt =
            `👤 *اسم العميل:* ${n}\n` +
            `🔢 *رقم الأوردر اليومي:* ${formattedOrderCode}\n` +
            `🗄️ *مكان التخزين:* ${shelf}\n` +
            `📅 *تاريخ الاستلام:* ${r}\n` +
            `📦 *تاريخ التسليم:* ${d}\n\n` +
            `👟 *كوتشيات:* ${sk} | 🥾 *جزم:* ${ss} | 🩴 *شبشب:* ${sl}\n` +
            `👡 *صندل:* ${sn} | 👞 *فردة:* ${sg} | 💼 *شنط:* ${bg}\n` +
            `🛠️ *الخدمة:* ${sv}\n\n` +
            `💰 *الحساب الكلي:* ${t} جنيه\n` +
            `💵 *المدفوع مقدمًا:* ${p} جنيه\n` +
            `🔴 *المبلغ المتبقي:* ${rm} جنيه`;

        if (m === 'client') {
            if (ph.startsWith("0")) {
                ph = "2" + ph;
            }

            var msg =
                `✨ *ALESKAFY SHOES* ✨\n` +
                `🧾 *إيصال استلام صيانة رقم (${formattedOrderCode})*\n\n` +
                baseTxt +
                `\n\n⚠️ *تنبيه:* المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد التسليم.` +
                `\n\n━━━━━━━━━━━━━━━\n` +
                `🌐 تابع صفحة المحل على فيسبوك:\n` +
                `https://www.facebook.com/61560847583033\n\n` +
                `❤️ شكراً لزيارتكم ونتشرف بخدمتكم دائماً.`;

            window.location.href = "whatsapp://send?phone=" + ph + "&text=" + encodeURIComponent(msg);

        } else {
            let imagesText = "";
            if (imgUrls.length > 0) {
                imagesText = "\n\n🖼️ *صور القطع قبل الصيانة:*";
                imgUrls.forEach((url, index) => {
                    imagesText += `\n📷 *الصورة ${index + 1}:*\n${url}`;
                });
            } else {
                imagesText = "\n\n🖼️ *صور القطع قبل الصيانة:* لا توجد صور.";
            }

            var oMsg =
                `📥 *[ALESKAFY SHOES - نسخة المحل]*\n` +
                `🧾 *أرشيف أوردر رقم (${formattedOrderCode}) على (${shelf})*\n\n` +
                baseTxt +
                imagesText +
                `\n\n⚠️ *تنبيه:* المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد التسليم.\n\n` +
                `🙏 *شكراً لزيارتكم الجميلة* ❤️`;

            window.location.href = "whatsapp://send?phone=" + OWNER_PHONE + "&text=" + encodeURIComponent(oMsg);
        }
    }

    async function resetFormForNextInvoice() {
        document.getElementById('invoiceForm').reset();
        document.getElementById('previewsContainer').innerHTML = '';
        document.getElementById('uploadStatus').style.display = 'none';
        uploadedImageUrls = [];
        selectedFilesList = [];
        isCurrentInvoiceSaved = false;
        document.getElementById('rDate').valueAsDate = new Date();
        await fetchNextInvoiceNum();
        alert("جاهز للفاتورة الجديدة، ورقم اليوم اترقم تلقائي 👍");
    }

    async function rep() {
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);

        const { data: list, error } = await supabaseClient
            .from('invoices')
            .select('*')
            .gte('created_at', todayStart.toISOString());

        if (error || !list || list.length === 0) {
            alert("لا توجد فواتير اليوم!");
            return;
        }
        
        var t = 0, p = 0, r = 0,
            txt = "📊 تقرير حسابات الإسكافي شوز 📊\n====================\n\n";

        list.forEach(function(x, idx) {
            var rem = (x.price || 0) - (x.paid || 0);
            var code = x.order_code || (idx + 1);
            var shelfInfo = x.shelf ? ` [${x.shelf}]` : '';
            txt += `أوردر (${code})${shelfInfo} - العميل: ${x.customer_name}\nالحساب: ${x.price} ج | المدفوع: ${x.paid} ج | الباقي: ${rem} ج\n--------------------\n`; 
            t += (x.price || 0);
            p += (x.paid || 0);
            r += rem;
        });

        txt += "\n====================\n💰 إجمالي اليوم: "+t+" ج\n💵 إجمالي الخزنة: "+p+" ج\n🔴 إجمالي المتبقي: "+r+" ج";

        var b = new Blob(["\uFEFF" + txt], { type: "text/plain;charset=utf-8" });
        var lnk = document.createElement('a');
        lnk.href = URL.createObjectURL(b);
        lnk.download = "Report_" + new Date().toISOString().slice(0,10) + ".txt";
        document.body.appendChild(lnk);
        lnk.click();
        document.body.removeChild(lnk);
        URL.revokeObjectURL(lnk.href);
    }

    async function searchByDailyNumber() {
        const query = document.getElementById('dailySearchInput').value.trim();
        const resBox = document.getElementById('searchResults');

        if (!query) {
            alert('أدخل رقم الأوردر للبحث (مثل 1 أو 2)');
            return;
        }

        resBox.style.display = 'block';
        resBox.innerHTML = 'جاري البحث... ⏳';

        const { data, error } = await supabaseClient
            .from('invoices')
            .select('*')
            .eq('daily_num', parseInt(query) || 0)
            .order('created_at', { ascending: false });

        renderSearchResults(data, error, resBox);
    }

    async function searchInvoices() {
        const query = document.getElementById('searchInput').value.trim();
        const resBox = document.getElementById('searchResults');

        if (!query) {
            alert('أدخل اسم أو رقم للبحث');
            return;
        }

        resBox.style.display = 'block';
        resBox.innerHTML = 'جاري البحث... ⏳';

        const { data, error } = await supabaseClient
            .from('invoices')
            .select('*')
            .or(`customer_name.ilike.%${query}%,phone.ilike.%${query}%`)
            .order('created_at', { ascending: false });

        renderSearchResults(data, error, resBox);
    }

    function renderSearchResults(data, error, resBox) {
        if (error || !data || data.length === 0) {
            resBox.innerHTML = '<div style="color: #ef4444; text-align: center;">لا توجد فواتير مطابقة!</div>';
            return;
        }

        resBox.innerHTML = data.map(inv => {
            const isDone = inv.status === 'تم الانتهاء من الصيانة';
            const statusClass = isDone ? 'bg-done' : 'bg-pending';
            const price = inv.price || 0;
            const paid = inv.paid || 0;
            const rem = price - paid;
            const phoneVal = inv.phone || '-';
            const itemType = inv.item_type || '-';
            const details = inv.details || '-';
            const shelfVal = inv.shelf || 'غير محدد';
            
            // تحويل كود الأوردر لبسط وتحتيه مقام بخط فاصل في نتائج البحث أيضاً
            let orderCodeParts = inv.order_code ? inv.order_code.split('/') : [inv.daily_num, ''];
            let numTop = orderCodeParts[0] || '';
            let numBottom = orderCodeParts[1] || '';

            let fractionHtml = `
                <span class="fraction" style="font-size: 14px;">
                    <span class="numerator">${numTop}</span>
                    <span class="denominator">${numBottom}</span>
                </span>
            `;

            let imageLinks = '';
            if (inv.image_url) {
                const imageUrls = String(inv.image_url).split(/\r?\n/).map(url => url.trim()).filter(url => url.length > 1);
                imageLinks = imageUrls.map((url, index) => {
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#f59e0b; font-size:12px; display:inline-block; margin-left:8px; margin-top:4px; text-decoration:none;">🖼️ عرض صورة ${index + 1}</a>`;
                }).join('');
            }

            return `
                <div style="border-bottom: 1px dashed #475569; padding-bottom: 12px; margin-bottom: 12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
                        <strong style="color: #f59e0b; font-size: 15px;">👤 ${inv.customer_name}</strong>
                        <span class="status-badge ${statusClass}">${inv.status || 'تحت الصيانة'}</span>
                    </div>
                    <div style="font-size: 13px; color: #38bdf8; margin-bottom: 3px; display:flex; align-items:center; gap:6px;">
                        🔢 <b>رقم اليوم:</b> ${fractionHtml} | 🗄️ <b>المكان:</b> <span style="color:#facc15; font-weight:bold;">${shelfVal}</span>
                    </div>
                    <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 3px;">📱 الموبايل: ${phoneVal}</div>
                    <div style="font-size: 13px; color: #e2e8f0; margin-bottom: 3px;">👟 <b>الأصناف:</b> ${itemType}</div>
                    <div style="font-size: 13px; color: #e2e8f0; margin-bottom: 3px;">🛠️ <b>الخدمة:</b> ${details}</div>
                    <div style="font-size: 13px; margin-bottom: 4px;">💰 الحساب: ${price} ج | 💵 المدفوع: ${paid} ج | 🔴 الباقي: <span style="color:#ef4444; font-weight:bold;">${rem} ج</span></div>
                    <div>${imageLinks}</div>
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <button type="button" class="btn-sm" style="background:#22c55e; color:#fff;" onclick="updateStatus(${inv.id}, 'تم الانتهاء من الصيانة')">✅ تم الانتهاء</button>
                        <button type="button" class="btn-sm" style="background:#d97706; color:#fff;" onclick="updateStatus(${inv.id}, 'تحت الصيانة')">⏳ تحت الصيانة</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function updateStatus(id, newStatus) {
        const { error } = await supabaseClient.from('invoices').update({ status: newStatus }).eq('id', id);
        if (!error) {
            alert('تم تغيير حالة الفاتورة بنجاح 👍');
            if(document.getElementById('searchInput').value.trim() !== '') searchInvoices();
        } else {
            alert('حدث خطأ أثناء التحديث!');
        }
    }
</script>
</body>
</html>
